<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS OS Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card: #f7f6f3;
      --card-dot: rgba(0, 0, 0, 0.05);
      --border: rgba(0, 0, 0, 0.08);
      --highlight: rgba(255, 255, 255, 0.8);
      --text-top: #0f172a;
      --text-bottom: #475569;
      --muted: #64748b;
      --track: rgba(0, 0, 0, 0.07);
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.14);
    }

    :root[data-theme="dark"] {
      --bg: #191919; /* Exact Notion Dark Mode */
      --card: #202022;
      --card-dot: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --highlight: rgba(255, 255, 255, 0.07);
      --text-top: #f8fafc;
      --text-bottom: #94a3b8;
      --muted: #71717a;
      --track: rgba(255, 255, 255, 0.07);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      overflow: hidden;
      user-select: none;
    }

    .card {
      position: relative;
      width: 100%;
      background-color: var(--card);
      background-image:
        radial-gradient(circle at 12% 0%, var(--accent-glow), transparent 58%),
        radial-gradient(var(--card-dot) 1px, transparent 1px);
      background-size: 100% 100%, 14px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 var(--highlight);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    /* Top Status Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 500;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    #fmt-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.62rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    #fmt-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    /* Main Time Display */
    .time-wrap {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      padding: 2px 0;
    }

    .hm {
      font-size: clamp(1.8rem, 15vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, var(--text-top) 25%, var(--text-bottom) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .colon {
      display: inline-block;
      margin: 0 1px;
      animation: blink 2s steps(2, start) infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .sec-group {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      margin-left: 3px;
      gap: 2px;
    }

    #sec {
      font-size: clamp(0.8rem, 5.5vw, 1.05rem);
      font-weight: 500;
      color: var(--accent);
      opacity: 0.85;
    }

    #ampm {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      display: none;
    }

    /* Footer Date & Day Progress */
    .footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #date {
      color: var(--text-bottom);
      font-weight: 500;
    }

    #day-pct {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background-color: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.6s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <div class="status">
        <span class="dot"></span>
        <span id="greeting">SYS // LIVE</span>
      </div>
      <button id="fmt-btn" type="button" title="Toggle 12H / 24H">24H</button>
    </div>

    <div class="time-wrap">
      <div class="hm"><span id="hr">00</span><span class="colon">:</span><span id="min">00</span></div>
      <div class="sec-group">
        <span id="ampm">AM</span>
        <span id="sec">00</span>
      </div>
    </div>

    <div class="footer">
      <div class="meta">
        <span id="date">--- --</span>
        <span id="day-pct">DAY 0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // Optional accent colors via URL: ?accent=cyan | purple | coral | emerald
    const accents = {
      cyan:    ["#38bdf8", "rgba(56, 189, 248, 0.16)"],
      purple:  ["#a78bfa", "rgba(167, 139, 250, 0.18)"],
      coral:   ["#f87171", "rgba(248, 113, 113, 0.16)"],
      emerald: ["#34d399", "rgba(52, 211, 153, 0.16)"],
      white: ["#FFFFFF", "rgba(255,255,255, 0.16)"],
      gray: ["#969696", "rgba(150, 150, 150, 0.18)"]
    };

    const chosenAccent = accents[params.get("accent")];
    if (chosenAccent) {
      document.documentElement.style.setProperty("--accent", chosenAccent[0]);
      document.documentElement.style.setProperty("--accent-glow", chosenAccent[1]);
    }

    function applyTheme() {
      const forced = params.get("theme");
      if (forced === "dark" || forced === "light") {
        document.documentElement.dataset.theme = forced;
        return;
      }
      const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
    }

    applyTheme();
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

    let saved12h = false;
    try { saved12h = localStorage.getItem("cs_os_clock_12h") === "true"; } catch (e) {}
    let is12h = params.get("format") === "12" || saved12h;

    const hrEl = document.getElementById("hr");
    const minEl = document.getElementById("min");
    const secEl = document.getElementById("sec");
    const ampmEl = document.getElementById("ampm");
    const dateEl = document.getElementById("date");
    const greetEl = document.getElementById("greeting");
    const pctEl = document.getElementById("day-pct");
    const fillEl = document.getElementById("progress-fill");
    const fmtBtn = document.getElementById("fmt-btn");

    function getGreeting(h) {
      if (h < 5)  return "SYS // LATE NIGHT";
      if (h < 12) return "SYS // MORNING";
      if (h < 17) return "SYS // AFTERNOON";
      if (h < 21) return "SYS // EVENING";
      return "SYS // NIGHT";
    }

    function updateClock() {
      const now = new Date();
      const rawH = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();

      let displayH = rawH;
      if (is12h) {
        ampmEl.textContent = rawH >= 12 ? "PM" : "AM";
        ampmEl.style.display = "block";
        displayH = rawH % 12 || 12;
        fmtBtn.textContent = "12H";
      } else {
        ampmEl.style.display = "none";
        fmtBtn.textContent = "24H";
      }

      hrEl.textContent = String(displayH).padStart(2, "0");
      minEl.textContent = String(m).padStart(2, "0");
      secEl.textContent = String(s).padStart(2, "0");

      const weekday = now.toLocaleDateString("en-US", { weekday: "short" });
      const month = now.toLocaleDateString("en-US", { month: "short" });
      const day = String(now.getDate()).padStart(2, "0");
      dateEl.textContent = `${weekday}, ${month} ${day}`;
      greetEl.textContent = getGreeting(rawH);

      const secondsPassed = rawH * 3600 + m * 60 + s;
      const pct = Math.round((secondsPassed / 86400) * 100);
      pctEl.textContent = `DAY ${pct}%`;
      fillEl.style.width = `${(secondsPassed / 86400) * 100}%`;
    }

    fmtBtn.addEventListener("click", () => {
      is12h = !is12h;
      try { localStorage.setItem("cs_os_clock_12h", String(is12h)); } catch (e) {}
      updateClock();
    });

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
